<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo banner de ofertas 2.0</title>
<!-- Réplica del marcado actual del carrusel de promociones para revisar el tema en local. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://unpkg.com/swiper@8.4.7/swiper-bundle.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
<link rel="stylesheet" href="io-theme.css">
</head>
<body>
<div id="carruselPromociones" class="promociones-carrusel-container">
  <div class="swiper promociones-swiper">
    <div class="swiper-wrapper">
      <div class="swiper-slide">
        <div class="anuncio-promo bg-gradient-primary">
          <input type="hidden" class="fechaPromo" value="2026-11-20 23:59:00">
          <div class="d-flex promoInline align-items-center">
            <svg class="mx-4 promoImg" xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" stroke-width="1.5" stroke="#ffffff" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"></rect><line x1="12" y1="8" x2="12" y2="21"></line><path d="M19 12v7a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-7"></path><path d="M7.5 8a2.5 2.5 0 0 1 0 -5a4.8 8 0 0 1 4.5 5a4.8 8 0 0 1 4.5 -5a2.5 2.5 0 0 1 0 5"></path></svg>
            <div class="promo"><p class="text-white fw-bold mb-0">Buen Fin 2026: 2x1 en conferencias y cursos en línea</p></div>
          </div>
          <div class="d-flex justify-content-evenly align-items-center promoInline">
            <div class="countdown-promo">
              <ul class="contenedor-temporizador promoInline">
                <li class="info text-white"><span class="detalle fw-bold promo-days">02</span>Días</li>
                <li class="info text-white"><span class="detalle fw-bold promo-hours">09</span>Horas</li>
                <li class="info text-white"><span class="detalle fw-bold promo-minutes">33</span>Min</li>
                <li class="info text-white"><span class="detalle fw-bold promo-seconds">09</span>Seg</li>
              </ul>
            </div>
            <div class="promoInline"><a href="#" class="btn get-started-btn btnPromo">Ver productos 2x1</a></div>
          </div>
        </div>
      </div>
    </div>
    <div class="swiper-button-next promo-nav"></div>
    <div class="swiper-button-prev promo-nav"></div>
    <div class="swiper-pagination promo-pagination"><span class="swiper-pagination-bullet swiper-pagination-bullet-active"></span><span class="swiper-pagination-bullet"></span><span class="swiper-pagination-bullet"></span></div>
  </div>
</div>
<header class="d-flex align-items-center justify-content-between px-4 py-3" style="background:var(--io-superficie)">
  <strong style="font-size:28px;color:var(--io-texto)">iO</strong>
  <nav><a class="nav-link d-inline" href="#">Inicio</a> <a class="nav-link d-inline" href="#">Catálogo</a> <a class="nav-link d-inline" href="/ayuda.html">Ayuda</a></nav>
</header>
<script src="io-theme.js"></script>
</body>
</html>
